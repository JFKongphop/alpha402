# fly.toml app configuration file generated for alpha402 on 2026-09-10T16:16:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'alpha402'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '4021'
  WEB_DIST = '/app/apps/web/dist'

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
